services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: modelmux
      MYSQL_USER: modelmux
      MYSQL_PASSWORD: ${MODELMUX_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MODELMUX_DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MODELMUX_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  modelmux:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${MODELMUX_ENV_FILE:-../.env.public}
    environment:
      MODELMUX_DATABASE_URL: mysql://modelmux:${MODELMUX_DB_PASSWORD}@mysql:3306/modelmux
      MODELMUX_DATA_DIR: /var/lib/modelmux
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4000"
    volumes:
      - modelmux_data:/var/lib/modelmux
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:4000/health | grep -q '"ready":true'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      modelmux:
        condition: service_healthy
    environment:
      MODELMUX_DOMAIN: ${MODELMUX_DOMAIN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  modelmux_data:
